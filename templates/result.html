<!-- templates/result.html -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>EduGenAI - Result</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gradient-to-bl from-indigo-100 to-pink-200 min-h-screen flex items-center justify-center p-4">

  <div class="bg-white shadow-2xl rounded-lg p-8 w-full max-w-4xl space-y-6">
    <h2 class="text-3xl font-extrabold text-center text-purple-700">Your Educational Video is Ready! 🎉</h2>

    <div class="flex flex-col md:flex-row gap-6">
      <div class="w-full md:w-1/2">
        <video controls class="rounded-lg w-full shadow-md">
          <source src="{{ video_path }}" type="video/mp4">
          Your browser does not support the video tag.
        </video>
      </div>

      <div class="w-full md:w-1/2">
        <h3 class="text-lg font-semibold text-gray-700 mb-2">🎤 Generated Script:</h3>
        <div class="bg-gray-100 p-4 rounded-lg overflow-auto h-60 whitespace-pre-wrap text-sm font-mono border border-gray-300">
          {{ script }}
        </div>

        <a href="{{ audio_path }}" class="mt-4 inline-block text-indigo-600 font-semibold hover:underline">🔊 Download Audio</a>
      </div>
    </div>

    <div class="text-center">
      <a href="/" class="mt-6 inline-block px-6 py-2 bg-indigo-600 text-white rounded hover:bg-indigo-700 transition">⬅️ Generate Another</a>
    </div>
  </div>

</body>
</html>
