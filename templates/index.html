<!-- templates/index.html -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>EduGenAI - Create Video</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gradient-to-br from-blue-100 to-purple-200 min-h-screen flex items-center justify-center">

  <div class="bg-white shadow-xl rounded-lg p-8 w-full max-w-md">
    <h1 class="text-3xl font-bold text-center text-indigo-600 mb-6">EduGenAI Video Generator</h1>

    {% if error %}
      <p class="bg-red-100 text-red-600 px-4 py-2 rounded mb-4 text-sm font-medium">{{ error }}</p>
    {% endif %}

    <form action="/generate" method="POST" class="space-y-4">
      <div>
        <label class="block text-sm font-medium text-gray-700">Topic</label>
        <input type="text" name="topic" placeholder="e.g. Solar System" class="w-full px-4 py-2 border rounded focus:outline-none focus:ring-2 focus:ring-indigo-500" required>
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-700">Age</label>
        <input type="number" name="age" min="3" max="40" placeholder="e.g. 8" class="w-full px-4 py-2 border rounded focus:outline-none focus:ring-2 focus:ring-indigo-500" required>
      </div>
      
      <div>
        <label class="block text-sm font-medium text-gray-700">Voice (Optional)</label>
        <select name="voice" class="w-full px-4 py-2 border rounded">
          <option value="default">Default</option>
          <option value="male">Male</option>
          <option value="female">Female</option>
        </select>
      </div>

      <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-2 rounded transition">Generate Video</button>
    </form>
  </div>
</body>
</html>
